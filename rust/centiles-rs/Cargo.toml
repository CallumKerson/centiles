[package]
name = "centiles-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust port of `src/centiles/`, generated by rust-anything"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
regex = "1.13.2"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "unbounded_depth"] }
unicode-general-category = "1.1.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[profile.release]
lto = true
