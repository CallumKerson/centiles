# cargo-deny policy for every crate under rust/, run by hk.
# See https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# Every advisory fails, unmaintained and unsound crates included.
unmaintained = "all"
yanked = "deny"
ignore = [
  # humantime is unmaintained with no safe upgrade. It reaches us only through
  # trycmd, the test-only dependency that replays rust/app-cases.
  { id = "RUSTSEC-2026-0542", reason = "test-only, via trycmd; no safe upgrade" },
]

[licenses]
# Licences compatible with the AGPL-3.0-or-later the crates are under.
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates aren't wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
